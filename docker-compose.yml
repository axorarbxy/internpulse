services:
  # ==========================================
  # 1. Databases & Message Brokers
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: internpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_internship
      POSTGRES_USER: internpulse
      POSTGRES_PASSWORD: internpulse_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
      - ./database/02-init-seed.sql:/docker-entrypoint-initdb.d/02-init-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internpulse -d smart_internship"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: internpulse-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: internpulse-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Module 1: Core Express Gateway API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: internpulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-a-local-development-secret}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:-a-local-internal-service-key}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smart_internship
      DB_USER: internpulse
      DB_PASSWORD: internpulse_local
      RECOMMENDATION_API_URL: http://recommendation-engine:8001
      CHATBOT_API_URL: http://chatbot:8002
      GRIEVANCE_API_URL: http://grievance-system:8003
      FEEDBACK_API_URL: http://feedback-analysis:8004
      FRAUD_API_URL: http://fraud-detection:8005
      MODULE4_API_URL: http://module4-backend:5004
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 3. Module 4: Real-time, Sockets & Security
  # ==========================================
  module4-backend:
    build:
      context: ./Module-04/module-04-backend
      dockerfile: Dockerfile
    container_name: internpulse-module4
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      NODE_ENV: production
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SOCKET_ORIGIN: ${SOCKET_ORIGIN:-http://localhost:5173}
      DATABASE_URL: mongodb://mongodb:27017/module4_prod
      JWT_SECRET: ${JWT_SECRET:-a-local-development-secret}
      REDIS_URL: redis://redis:6379
      CERTIFICATE_SIGNING_KEY: ${CERTIFICATE_SIGNING_KEY:-a-local-certificate-key}
      MODULE1_MODE: live
      MODULE1_BASE_URL: http://backend:5000
      MODULE1_SERVICE_TOKEN: ${INTERNAL_SERVICE_KEY:-a-local-internal-service-key}
      MODULE3_MODE: mock
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ==========================================
  # 4. Module 3: AI Intelligence Microservices
  # ==========================================
  recommendation-engine:
    build:
      context: ./module3/recommendation-engine
      dockerfile: Dockerfile
    container_name: internpulse-ai-recommendation
    restart: unless-stopped
    ports:
      - "8001:8001"

  chatbot:
    build:
      context: ./module3/chatbot
      dockerfile: Dockerfile
    container_name: internpulse-ai-chatbot
    restart: unless-stopped
    ports:
      - "8002:8002"

  grievance-system:
    build:
      context: ./module3/grievance-system
      dockerfile: Dockerfile
    container_name: internpulse-ai-grievance
    restart: unless-stopped
    ports:
      - "8003:8003"

  feedback-analysis:
    build:
      context: ./module3/feedback-analysis
      dockerfile: Dockerfile
    container_name: internpulse-ai-feedback
    restart: unless-stopped
    ports:
      - "8004:8004"

  fraud-detection:
    build:
      context: ./module3/fraud-detection
      dockerfile: Dockerfile
    container_name: internpulse-ai-fraud
    restart: unless-stopped
    ports:
      - "8005:8005"

  # ==========================================
  # 5. Module 2: Frontend & Nginx Gateway
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: module2/frontend/Dockerfile
    container_name: internpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      module4-backend:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
