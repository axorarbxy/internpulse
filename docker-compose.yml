services:
  # ==========================================
  # 1. Databases & Message Brokers
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: internpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_internship
      POSTGRES_USER: internpulse
      POSTGRES_PASSWORD: internpulse_local
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01-init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql:ro
      - ./database/02-init-seed.sql:/docker-entrypoint-initdb.d/02-init-seed.sql:ro
      - ./database/03-institution-membership.sql:/docker-entrypoint-initdb.d/03-institution-membership.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internpulse -d smart_internship"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: internpulse-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: internpulse-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Module 1: Core Express Gateway API
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: internpulse-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: internpulse-jwt-secret-2026-strong-32chars
      INTERNAL_SERVICE_KEY: internpulse-internal-service-key-2026-strong
      CORE_SERVICE_KEY: internpulse-internal-service-key-2026-strong
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smart_internship
      DB_USER: internpulse
      DB_PASSWORD: internpulse_local
      RECOMMENDATION_API_URL: http://recommendation-engine:8001
      CHATBOT_API_URL: http://chatbot:8002
      GRIEVANCE_API_URL: http://grievance-system:8003
      FEEDBACK_API_URL: http://feedback-analysis:8004
      FRAUD_API_URL: http://fraud-detection:8005
      MODULE4_API_URL: http://module4-backend:5004
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 3. Module 4: Real-time, Sockets & Security
  # ==========================================
  module4-backend:
    build:
      context: ./Module-04/module-04-backend
      dockerfile: Dockerfile
    container_name: internpulse-module4
    restart: unless-stopped
    ports:
      - "5004:5004"
    environment:
      PORT: 5004
      NODE_ENV: ${NODE_ENV:-development}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SOCKET_ORIGIN: ${SOCKET_ORIGIN:-http://localhost:5173}
      DATABASE_URL: mongodb://mongodb:27017/module4_prod
      JWT_SECRET: internpulse-jwt-secret-2026-strong-32chars
      REDIS_URL: redis://redis:6379
      CERTIFICATE_SIGNING_KEY: internpulse-certificate-signing-key-2026-strong
      MODULE1_MODE: live
      MODULE1_BASE_URL: http://backend:5000
      MODULE1_SERVICE_TOKEN: internpulse-internal-service-key-2026-strong
      FRAUD_GATE_MODE: enforce
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:5173}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ==========================================
  # 4. Module 3: AI Intelligence Microservices
  # ==========================================
  recommendation-engine:
    build:
      context: ./module3/recommendation-engine
      dockerfile: Dockerfile
    container_name: internpulse-ai-recommendation
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      CORE_API_URL: http://backend:5000
      CORE_SERVICE_KEY: internpulse-internal-service-key-2026-strong
      FEEDBACK_API_URL: http://feedback-analysis:8004
    depends_on:
      backend:
        condition: service_healthy
      feedback-analysis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  chatbot:
    build:
      context: ./module3/chatbot
      dockerfile: Dockerfile
    container_name: internpulse-ai-chatbot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      MODULE3_DATA_DIR: /data
      CORE_SERVICE_KEY: internpulse-internal-service-key-2026-strong
      GRIEVANCE_API_URL: http://grievance-system:8003
    volumes:
      - chatbot_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  grievance-system:
    build:
      context: ./module3/grievance-system
      dockerfile: Dockerfile
    container_name: internpulse-ai-grievance
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      MODULE3_DATA_DIR: /data
      CORE_SERVICE_KEY: internpulse-internal-service-key-2026-strong
    volumes:
      - grievance_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  feedback-analysis:
    build:
      context: ./module3/feedback-analysis
      dockerfile: Dockerfile
    container_name: internpulse-ai-feedback
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      MODULE3_DATA_DIR: /data
      CORE_SERVICE_KEY: internpulse-internal-service-key-2026-strong
    volumes:
      - feedback_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  fraud-detection:
    build:
      context: ./module3/fraud-detection
      dockerfile: Dockerfile
    container_name: internpulse-ai-fraud
    restart: unless-stopped
    ports:
      - "127.0.0.1:8005:8005"
    environment:
      MODULE3_DATA_DIR: /data
      CORE_SERVICE_KEY: internpulse-internal-service-key-2026-strong
      GRIEVANCE_API_URL: http://grievance-system:8003
      MODULE4_API_URL: http://module4-backend:5004
    volumes:
      - fraud_data:/data
    depends_on:
      module4-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ==========================================
  # 5. Module 2: Frontend & Nginx Gateway
  # ==========================================
  frontend:
    build:
      context: .
      dockerfile: module2/frontend/Dockerfile
    container_name: internpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
      module4-backend:
        condition: service_healthy
      recommendation-engine:
        condition: service_healthy
      chatbot:
        condition: service_healthy
      grievance-system:
        condition: service_healthy
      feedback-analysis:
        condition: service_healthy
      fraud-detection:
        condition: service_healthy

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  chatbot_data:
  grievance_data:
  feedback_data:
  fraud_data:
